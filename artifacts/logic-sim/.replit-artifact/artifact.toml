kind = "web"
previewPath = "/"
title = "Logic Circuit Simulator"
version = "1.0.0"
id = "artifacts/logic-sim"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19572

[services.development]
run = "pnpm --filter @workspace/logic-sim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/logic-sim", "run", "build" ]
serve = "static"
publicDir = "artifacts/logic-sim/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19572"
BASE_PATH = "/"
